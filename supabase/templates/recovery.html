<div style="font-family: Arial, Helvetica, sans-serif; color: #16181D; max-width: 520px; margin: 0 auto; padding: 32px 24px;">
  <p style="font-family: Georgia, serif; font-size: 22px; color: #1F2A55; margin: 0 0 24px;">Traders at Carolina</p>
  <h1 style="font-family: Georgia, serif; font-weight: normal; font-size: 26px; margin: 0 0 16px;">Reset your password</h1>
  <p style="font-size: 16px; line-height: 1.6; margin: 0 0 24px;">Someone asked to reset the password for your Traders at Carolina account. Click below to choose a new one.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="display: inline-block; background: #1F2A55; color: #FFFFFF; text-decoration: none; padding: 14px 22px; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px;">Choose a new password</a>
  </p>
  <p style="font-size: 13px; line-height: 1.5; color: #5A5F6B; margin: 0;">This link works once and expires soon. If you didn't ask for it, you can ignore this email and your password won't change.</p>
</div>
