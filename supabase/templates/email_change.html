<div style="font-family: Arial, Helvetica, sans-serif; color: #16181D; max-width: 520px; margin: 0 auto; padding: 32px 24px;">
  <p style="font-family: Georgia, serif; font-size: 22px; color: #1F2A55; margin: 0 0 24px;">Traders at Carolina</p>
  <h1 style="font-family: Georgia, serif; font-weight: normal; font-size: 26px; margin: 0 0 16px;">Confirm your new email</h1>
  <p style="font-size: 16px; line-height: 1.6; margin: 0 0 24px;">Click below to confirm that {{ .NewEmail }} should be the login email for your Traders at Carolina account.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/portal/profile"
       style="display: inline-block; background: #1F2A55; color: #FFFFFF; text-decoration: none; padding: 14px 22px; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px;">Confirm email change</a>
  </p>
  <p style="font-size: 13px; line-height: 1.5; color: #5A5F6B; margin: 0;">If you didn't ask for this change, ignore this email and tell a club president.</p>
</div>
